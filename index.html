<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Alchemy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            overflow-y: auto;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar h2 {
            color: white;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .element {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: grab;
            user-select: none;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
            font-weight: 500;
            text-align: center;
        }
        .element:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.8);
        }
        .element:active {
            cursor: grabbing;
        }
        .canvas {
            flex: 1;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }
        .placed-element {
            position: absolute;
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            cursor: grab;
            user-select: none;
            font-weight: 500;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-width: 80px;
            text-align: center;
        }
        .placed-element:active {
            cursor: grabbing;
            z-index: 1000;
        }
        .placed-element.dragging {
            opacity: 0.7;
            z-index: 1000;
        }
        .feedback {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            pointer-events: none;
            animation: slideDown 0.5s ease-out forwards;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        .feedback.success {
            color: #27ae60;
        }
        .feedback.hint {
            color: #667eea;
        }
        .count {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>Elements</h2>
            <div id="elementList"></div>
        </div>
        <div class="canvas" id="canvas"></div>
    </div>
    <div class="count">
        <span id="discoveredCount">0</span> discovered
    </div>
    <script src="game.js"></script>
</body>
</html>
